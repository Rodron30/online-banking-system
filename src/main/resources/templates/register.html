<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Online Banking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <link rel="stylesheet" th:href="@{/css/glass-reference.css?v=20260821}">

</head>

<body>

<main class="auth-wrap">

    <section class="auth-card">

        <!-- Brand -->
        <div class="auth-brand">
            <span class="auth-brand-icon" aria-hidden="true">
                <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 25h50L32 9 7 25Z"/>
                    <path d="
                        M12 28h40v5H12z
                        M16 35h6v18h-6z
                        M29 35h6v18h-6z
                        M42 35h6v18h-6z
                        M10 54h44v4H10z
                    "/>
                </svg>
            </span>
            <span class="auth-brand-text">
                <strong>RODRON BANK</strong>
                <small>Online Banking System</small>
            </span>
        </div>

        <!-- Header -->
        <h1>Create your account</h1>
        <p class="sub">Open a new Rodron Bank account in minutes</p>

        <!-- Registration Error -->
        <div
            class="alert alert-error"
            th:if="${error}"
            th:text="${error}">
        </div>


        <!-- Registration Form -->
        <form
            th:action="@{/register}"
            method="post">

            <!-- CSRF Protection -->
            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">


            <!-- Full Name -->
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input
                    id="fullName"
                    type="text"
                    name="fullName"
                    required
                    minlength="1"
                    maxlength="100"
                    autocomplete="name"
                    placeholder="Juan Dela Cruz">
            </div>

            <!-- Username -->
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    required
                    minlength="3"
                    maxlength="50"
                    pattern="[A-Za-z0-9._-]+"
                    autocomplete="username"
                    placeholder="juandelacruz"
                    title="Use only letters, numbers, dot, underscore, and hyphen.">
                <small>Use only letters, numbers, dot, underscore, and hyphen.</small>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                    maxlength="150"
                    autocomplete="email"
                    placeholder="juan@example.com">
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input
                        id="password"
                        type="password"
                        name="password"
                        required
                        minlength="6"
                        maxlength="72"
                        autocomplete="new-password"
                        placeholder="Minimum 6 characters">

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password">
                        👁
                    </button>

                </div>

                <small>Password must be 6–72 characters.</small>

            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="password-wrapper">
                    <input
                        id="confirmPassword"
                        type="password"
                        name="confirmPassword"
                        required
                        minlength="6"
                        maxlength="72"
                        autocomplete="new-password"
                        placeholder="Re-enter your password">

                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword('confirmPassword', this)"
                        aria-label="Show password">
                        👁
                    </button>

                </div>

            </div>

            <!-- Submit -->
            <button
                type="submit" class="btn btn-primary btn-block">Create Account
            </button>

        </form>


        <!-- Login Link -->
        <p class="link-alt">Already have an account?
            <a th:href="@{/login}">Login</a>
        </p>

    </section>

</main>


<!-- Show / Hide Password -->
<script>
    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            button.textContent = "🙈";
            button.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            input.type = "password";
            button.textContent = "👁";
            button.setAttribute(
                "aria-label",
                "Show password"
            );
        }
    }
</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Transfer | Rodron Bank</title>

    <link
        rel="stylesheet"
        th:href="@{/css/style.css}">

    <link
        rel="stylesheet"
        th:href="@{/css/glass-reference.css?v=20260821}">

</head>


<body>

<div class="app-shell">


    <!-- =========================================================
         NAVBAR
         ========================================================= -->

    <div
        th:replace="~{fragments/navbar :: navbar('transfer')}">
    </div>



    <!-- =========================================================
         MAIN CONTENT
         ========================================================= -->

    <div class="app-content">


        <!-- TOPBAR -->

        <div
            th:replace="~{fragments/topbar :: topbar('', 'Transfer Money', 'Send money to another bank account.')}">
        </div>



        <main class="container">


            <div class="card">


                <!-- =================================================
                     SUCCESS MESSAGE
                     ================================================= -->

                <div
                    class="alert alert-success"
                    th:if="${success}"
                    th:text="${success}">

                    Transfer successful.

                </div>



                <!-- =================================================
                     ERROR MESSAGE
                     ================================================= -->

                <div
                    class="alert alert-error"
                    th:if="${error}"
                    th:text="${error}">

                    Transfer failed.

                </div>



                <!-- =================================================
                     TRANSFER FORM
                     ================================================= -->

                <form
                    th:action="@{/transfer}"
                    method="post"
                    autocomplete="off"
                    id="transferForm">


                    <!-- =================================================
                         CSRF
                         ================================================= -->

                    <input
                        type="hidden"
                        th:name="${_csrf.parameterName}"
                        th:value="${_csrf.token}">



                    <!-- =================================================
                         DESTINATION ACCOUNT NUMBER
                         ================================================= -->

                    <div class="form-group">

                        <label for="toAccountNumber">
                            Destination Account Number
                        </label>


                        <input
                            id="toAccountNumber"
                            type="text"
                            name="toAccountNumber"
                            required
                            minlength="16"
                            maxlength="16"
                            pattern="[0-9]{16}"
                            inputmode="numeric"
                            autocomplete="off"
                            placeholder="Enter 16-digit account number"
                            title="Account number must be exactly 16 digits">


                        <small>
                            Enter the recipient's 16-digit account number.
                        </small>

                    </div>



                    <!-- =================================================
                         TRANSFER AMOUNT
                         ================================================= -->

                    <div class="form-group">

                        <label for="amount">
                            Amount (₱)
                        </label>


                        <div class="deposit-input-wrapper">

                            <span
                                class="currency-symbol"
                                aria-hidden="true">
                                ₱
                            </span>


                            <input
                                id="amount"
                                type="text"
                                name="amount"
                                required
                                inputmode="decimal"
                                autocomplete="off"
                                placeholder="0.00"
                                class="money-input"
                                data-money-input
                                title="Enter a valid amount">

                        </div>


                        <small>
                            Enter the amount you want to transfer.
                        </small>

                    </div>



                    <!-- =================================================
                         DESCRIPTION
                         ================================================= -->

                    <div class="form-group">

                        <label for="description">
                            Description
                            <span class="optional-label">
                                (optional)
                            </span>
                        </label>


                        <input
                            id="description"
                            type="text"
                            name="description"
                            maxlength="255"
                            autocomplete="off"
                            placeholder="e.g. Payment">

                    </div>



                    <!-- =================================================
                         SUBMIT BUTTON
                         ================================================= -->

                    <button
                        type="submit"
                        class="btn btn-primary btn-block">

                        Transfer Money

                    </button>


                </form>



                <!-- =================================================
                     BACK TO DASHBOARD
                     ================================================= -->

                <p class="link-alt">

                    <a th:href="@{/dashboard}">
                        ← Back to Dashboard
                    </a>

                </p>


            </div>

        </main>

    </div>

</div>



<!-- =============================================================
     TRANSFER FORM JAVASCRIPT
     ============================================================= -->

<script>

(function () {

    "use strict";


    /*
     * =========================================================
     * ACCOUNT NUMBER
     * =========================================================
     */

    const accountInput =
        document.getElementById(
            "toAccountNumber"
        );


    if (accountInput) {

        accountInput.addEventListener(
            "input",
            function () {

                /*
                 * Numbers only
                 */
                this.value =
                    this.value.replace(/\D/g, "");


                /*
                 * Maximum 16 digits
                 */
                if (this.value.length > 16) {

                    this.value =
                        this.value.substring(0, 16);

                }

            }
        );

    }



    /*
     * =========================================================
     * MONEY FORMATTER
     * =========================================================
     *
     * 25000       -> 25,000
     * 250000      -> 250,000
     * 1000000     -> 1,000,000
     * 25000.50    -> 25,000.50
     *
     */

    function formatMoney(value) {

        if (!value) {
            return "";
        }


        /*
         * Remove commas
         */
        value =
            value.replace(/,/g, "");


        /*
         * Numbers and decimal only
         */
        value =
            value.replace(/[^\d.]/g, "");


        /*
         * Keep only ONE decimal point
         */
        const firstDot =
            value.indexOf(".");


        if (firstDot !== -1) {

            value =
                value.substring(0, firstDot + 1) +
                value
                    .substring(firstDot + 1)
                    .replace(/\./g, "");

        }


        /*
         * Split integer / decimal
         */
        const parts =
            value.split(".");


        let integerPart =
            parts[0] || "";


        let decimalPart =
            parts.length > 1
                ? parts[1]
                : null;


        /*
         * Remove leading zeros
         *
         * 00025000 -> 25000
         */
        if (integerPart.length > 1) {

            integerPart =
                integerPart.replace(
                    /^0+(?=\d)/,
                    ""
                );

        }


        /*
         * Add commas
         */
        if (integerPart) {

            integerPart =
                Number(integerPart)
                    .toLocaleString("en-US");

        }


        /*
         * Maximum 2 decimal places
         */
        if (decimalPart !== null) {

            decimalPart =
                decimalPart.substring(0, 2);

            return (
                integerPart +
                "." +
                decimalPart
            );

        }


        return integerPart;

    }



    /*
     * =========================================================
     * AMOUNT INPUT
     * =========================================================
     */

    const amountInput =
        document.getElementById("amount");


    if (amountInput) {

        amountInput.addEventListener(
            "input",
            function () {

                this.value =
                    formatMoney(this.value);

            }
        );

    }



    /*
     * =========================================================
     * SUBMIT VALIDATION
     * =========================================================
     */

    const transferForm =
        document.getElementById(
            "transferForm"
        );


    if (transferForm) {

        transferForm.addEventListener(
            "submit",
            function (event) {


                /*
                 * =============================================
                 * VALIDATE ACCOUNT NUMBER
                 * =============================================
                 */

                if (
                    accountInput &&
                    !/^\d{16}$/.test(
                        accountInput.value
                    )
                ) {

                    event.preventDefault();


                    alert(
                        "Destination account number must contain exactly 16 digits."
                    );


                    accountInput.focus();

                    return;

                }



                /*
                 * =============================================
                 * VALIDATE AMOUNT
                 * =============================================
                 */

                if (amountInput) {

                    const cleanAmount =
                        amountInput.value.replace(
                            /,/g,
                            ""
                        );


                    if (
                        !cleanAmount ||
                        isNaN(cleanAmount) ||
                        Number(cleanAmount) <= 0
                    ) {

                        event.preventDefault();


                        alert(
                            "Please enter a valid transfer amount."
                        );


                        amountInput.focus();

                        return;

                    }


                    /*
                     * =========================================
                     * REMOVE COMMA BEFORE SUBMIT
                     * =========================================
                     *
                     * 25,000
                     *
                     * becomes
                     *
                     * 25000
                     *
                     */

                    amountInput.value =
                        cleanAmount;

                }

            }
        );

    }

})();

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rodron Bank — Navigation</title>
</head>

<body>

<!-- =========================================================
     RODRON BANK — SIDEBAR
========================================================= -->

<th:block th:fragment="navbar(activePage)">

<nav
    class="sidebar"
    id="appSidebar"
    aria-label="Main navigation">

    <!-- =====================================================
         BRAND
    ====================================================== -->

    <a
        th:href="@{/dashboard}"
        class="sidebar-brand"
        aria-label="Rodron Bank Dashboard">

        <span class="sidebar-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M7 25h50L32 9 7 25Z"/>
                <path d="
                    M12 28h40v5H12z
                    M16 35h6v18h-6z
                    M29 35h6v18h-6z
                    M42 35h6v18h-6z
                    M10 54h44v4H10z
                "/>
            </svg>
        </span>

        <span class="sidebar-brand-text">
            <strong>RODRON BANK</strong>
            <small>Online Banking System</small>
        </span>

    </a>

    <!-- =====================================================
         MAIN NAVIGATION
    ====================================================== -->

    <div class="sidebar-nav">

        <!-- DASHBOARD -->
        <a
            th:href="@{/dashboard}"
            class="sidebar-link"
            th:classappend="${activePage == 'dashboard'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                </svg>
            </span>
            <span>Dashboard</span>
        </a>

        <!-- DEPOSIT / WITHDRAW -->
        <a
            th:href="@{/deposit-withdraw}"
            class="sidebar-link"
            th:classappend="${activePage == 'deposit'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3v13"/>
                    <path d="m7 11 5 5 5-5"/>
                    <path d="M5 21h14"/>
                </svg>
            </span>
            <span>Deposit / Withdraw</span>
        </a>

        <!-- TRANSFER -->
        <a
            th:href="@{/transfer}"
            class="sidebar-link"
            th:classappend="${activePage == 'transfer'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M3 7h15"/>
                    <path d="m14 3 4 4-4 4"/>
                    <path d="M21 17H6"/>
                    <path d="m10 13-4 4 4 4"/>
                </svg>
            </span>
            <span>Transfer</span>
        </a>

        <!-- TRANSACTION HISTORY -->
        <a
            th:href="@{/transactions}"
            class="sidebar-link"
            th:classappend="${activePage == 'history'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="3" width="14" height="18" rx="2"/>
                    <path d="M8 8h8"/>
                    <path d="M8 12h8"/>
                    <path d="M8 16h5"/>
                </svg>
            </span>
            <span>Transaction History</span>
        </a>

        <!-- PROFILE -->
        <a
            th:href="@{/profile}"
            class="sidebar-link"
            th:classappend="${activePage == 'profile'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
                </svg>
            </span>
            <span>Profile</span>
        </a>

        <!-- CHANGE PIN -->
        <a
            th:href="@{/change-pin}"
            class="sidebar-link"
            th:classappend="${activePage == 'pin'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="10" width="16" height="10" rx="2"/>
                    <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                </svg>
            </span>
            <span>Change PIN</span>
        </a>

        <!-- ADMIN (visible to admins only) -->
        <a
            th:if="${user != null and user.role != null and user.role.name() == 'ADMIN'}"
            th:href="@{/admin}"
            class="sidebar-link"
            th:classappend="${activePage == 'admin'} ? ' active' : ''">

            <span class="sidebar-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="
                        M12 3
                        20 6
                        v6
                        c0 5-3.5 8-8 10
                        -4.5-2-8-5-8-10V6l8-3Z
                    "/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </span>
            <span>Admin</span>
        </a>

    </div>


    <!-- =====================================================
         BOTTOM SECTION
    ====================================================== -->

    <div class="sidebar-bottom">

        <!-- LOGOUT -->
        <form
            th:action="@{/logout}"
            method="post"
            class="sidebar-logout-form">

            <input
                type="hidden"
                th:name="${_csrf.parameterName}"
                th:value="${_csrf.token}">

            <button
                type="submit"
                class="sidebar-logout-btn"
                aria-label="Logout">

                <span class="sidebar-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="
                            M10 5
                            H6
                            a2 2 0 0 0-2 2
                            v10
                            a2 2 0 0 0 2 2
                            h4
                        "/>
                        <path d="M14 8l4 4-4 4"/>
                        <path d="M8 12h10"/>
                    </svg>
                </span>
                <span>Logout</span>
            </button>

        </form>

        <!-- SECURITY STATUS -->
        <div
            class="sidebar-secure-box"
            role="status"
            aria-label="Banking secure">

            <span class="sidebar-secure-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="
                        M12 3
                        20 6
                        v6
                        c0 5-3.5 8-8 10
                        -4.5-2-8-5-8-10V6l8-3Z
                    "/>
                    <path d="M9 12l2 2 4-4"/>
                </svg>
            </span>

            <div>
                <strong>Secure Banking</strong>
                <small>Your security is our priority</small>
            </div>

        </div>

    </div>

</nav>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

</th:block>

</body>
</html>
